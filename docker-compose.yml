services:
  db:
    image: postgres:18-alpine
    container_name: club-hunt-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunt
      POSTGRES_PASSWORD: hunt_local_pw
      POSTGRES_DB: hunt
    ports:
      - "5433:5432"
    volumes:
      - hunt_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunt -d hunt"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hunt_pgdata:
